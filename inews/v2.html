<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Tracker Editor v3 (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#fafafa;--surface:#fff;--text:#0a0a0a;--muted:#6b6b6b;--border:#e6e6e6;--tile:#f2f2f2;--hover:#0a0a0a;--shadow:0 1px 2px rgba(0,0,0,.04)}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#141414;--text:#f5f5f5;--muted:#9a9a9a;--border:#2a2a2a;--tile:#1f1f1f;--hover:#f5f5f5;--shadow:none}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;transition:background .2s,color .2s}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.brand,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;white-space:nowrap}.back:hover{color:var(--text)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:15px}
h1{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--text);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;font-size:.85rem;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--hover)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.sm{padding:4px 12px;font-size:.78rem;box-shadow:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tile)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9a9a9a;flex:none}
.Developing{background:#d97706}.Confirmed{background:#16a34a}.Disputed{background:#dc2626}.Resolved{background:#6b7280}
#app{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr}
aside{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--border)}
.side-head{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.side-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
input[type=search],.form input:not([type=checkbox]),.form select,.form textarea{width:100%;padding:9px 14px;font-size:.9rem;background:var(--bg);border:1px solid var(--border);border-radius:12px}
input[type=search]{border-radius:999px;font-size:.88rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--hover)}
textarea{resize:vertical;line-height:1.5}
#list{overflow-y:auto;padding:8px;flex:1}
.conv{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;background:none;border:1px solid transparent;border-radius:12px;cursor:pointer}
.conv:hover,.conv.active{background:var(--tile)}.conv.active{border-color:var(--hover)}
.conv .t{font-size:.9rem;font-weight:600;overflow-wrap:anywhere}
.conv .m{margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted)}
.none{padding:16px;color:var(--muted);font-size:.88rem}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.placeholder{margin:auto;color:var(--muted);text-align:center;padding:48px 24px}
#ed{display:flex;flex-direction:column;min-height:0;flex:1}
.ed-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.ed-head h2{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em;flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;padding:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px}
.seg button{border:0;background:none;padding:5px 14px;font-size:.8rem;font-weight:500;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--text)}.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
#back{display:none}
.body{flex:1;overflow-y:auto;padding:24px;display:grid;gap:24px;align-content:start;align-items:start}
.body.split{grid-template-columns:1fr 1fr}
.pane{min-width:0;max-width:900px;width:100%;margin:0 auto}
.body.split .pane{max-width:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600}
.form small{font-weight:400;color:var(--muted);font-size:.78rem}
.form label.chk{flex-direction:row;align-items:flex-start;gap:10px}
.form label.chk input{width:16px;height:16px;margin-top:3px;accent-color:var(--text)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.tbar span{color:var(--muted);font-size:.88rem}
.ups{display:flex;flex-direction:column;gap:12px}
.u-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.u-top .acts{margin-left:auto;display:flex;gap:6px}
.u h3{margin:0 0 4px;font-size:1rem;font-weight:600;letter-spacing:-.01em}
.card.click{cursor:pointer;transition:border-color .15s}.card.click:hover,.card.open{border-color:var(--hover)}
.plain{white-space:pre-wrap;margin:0;font-size:.92rem;overflow-wrap:anywhere}
.u a,.read a{color:inherit;font-size:.85rem;font-weight:500}
.time{font-size:.78rem;color:var(--muted)}
.ar{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.ar-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--tile);font-size:.82rem}.ar-h .time{flex:1}
.ar-b{display:grid;grid-template-columns:1fr 1fr;min-height:300px}
.form .ar-b textarea{border:0;border-radius:0;border-right:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;min-height:300px;background:var(--surface)}
.ar-pv{padding:12px 16px;overflow:auto;max-height:520px;font-size:.92rem}
.ar.big{position:fixed;inset:0;z-index:80;border-radius:0;display:flex;flex-direction:column}
.ar.big .ar-b{flex:1;min-height:0}.form .ar.big textarea{min-height:0;height:100%;resize:none}.ar.big .ar-pv{max-height:none}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}.md img{max-width:100%;height:auto;border-radius:12px}
.md pre{background:var(--tile);padding:12px;border-radius:12px;overflow-x:auto}.md code{font-family:ui-monospace,Menlo,monospace;font-size:.88em}
.md blockquote{margin:12px 0;padding-left:14px;border-left:3px solid var(--border);color:var(--muted)}.md a{color:inherit}
.pv-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.pvw{container-type:inline-size}
.pv{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.banner{margin-bottom:16px;padding:10px 14px;border:1px solid var(--border);border-left:3px solid var(--text);border-radius:12px;font-size:.85rem}
.pv h1{white-space:normal;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:10px 0 20px}
.pv-strip{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 24px;padding:12px 16px;background:var(--tile);border-radius:12px;font-size:.85rem}
.pv-strip div{display:flex;flex-direction:column}.pv-strip span{color:var(--muted);font-size:.72rem}
.pv-cols{display:grid;gap:24px}
.tl2{display:flex;flex-direction:column;border-left:2px solid var(--border);margin-left:5px}
.tl-i{position:relative;text-align:left;background:none;border:0;border-radius:0 12px 12px 0;padding:8px 12px 8px 20px;cursor:pointer}
.tl-i:hover,.tl-i[aria-current="true"]{background:var(--tile)}
.tl-i[aria-current="true"]::before{content:'';position:absolute;left:-2px;top:0;bottom:0;width:2px;background:var(--text)}
.tl-i .dot{position:absolute;left:-7px;top:13px;box-shadow:0 0 0 3px var(--surface)}
.tl-i b{display:block;font-size:.9rem;font-weight:600;line-height:1.3}.tl-i .time{display:block}
.tl-i .cue{font-size:.72rem;font-weight:600;color:var(--muted)}
.more{margin:8px 0 0 14px;align-self:flex-start}
.read h2{margin:8px 0;font-size:1.3rem;letter-spacing:-.02em;line-height:1.25}
.lead{font-size:1rem;color:var(--muted);margin:0 0 16px}
@container (min-width:700px){.pv-cols{grid-template-columns:270px 1fr;align-items:start}.tl2{position:sticky;top:0}}
.sb-t{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ed-head .sb-t h2{flex:0 1 auto;min-width:0}
.chev{color:var(--muted);font-size:.8rem;width:10px}
.ed-head .seg{margin-left:auto}
.pill.ok{background:var(--text);color:var(--bg)}
.sb{padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);gap:0}
.sb-g{display:grid;grid-template-columns:2fr 1fr 1.4fr auto;gap:16px;align-items:end}
.sb-f{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:12px}
.form label.sw{flex-direction:row;align-items:center;gap:10px;cursor:pointer;padding-bottom:8px}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw input:checked{background:var(--text)}.sw input:checked::after{left:19px}
.body.split .ar-pv{display:none}.body.split .ar-b{grid-template-columns:1fr}.body.split .form .ar-b textarea{min-height:420px;border-right:0}
.body.split .ar.big .ar-pv{display:block}.body.split .ar.big .ar-b{grid-template-columns:1fr 1fr}.body.split .form .ar.big textarea{min-height:0;border-right:1px solid var(--border)}
@media(max-width:1099px){.sb-g{grid-template-columns:1fr 1fr}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:500;z-index:99}
@media(max-width:1099px){.body.split{grid-template-columns:1fr}}
@media(max-width:760px){
 .bar{padding:12px 16px}.back span{display:none}
 #app{grid-template-columns:1fr}#app.reading aside{display:none}#app:not(.reading) main{display:none}
 #back{display:inline-flex}.ed-head{padding:12px 16px}.body{padding:16px}
 .ar-b{grid-template-columns:1fr}.form .ar-b textarea{border-right:0;border-bottom:1px solid var(--border)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <a class="back" href="index.html">← <span>Tools Hub</span></a>
    <div class="logo" aria-hidden="true">📰</div>
    <h1>News Tracker Editor</h1>
    <span class="pill">Mockup v3</span>
  </div>
  <div class="actions">
    <span class="pill" id="bk"></span>
    <button class="btn" data-act="import" type="button">Import</button>
    <button class="btn" data-act="exportPub" type="button">Export public JSON</button>
    <button class="btn pri" data-act="backup" type="button">Backup</button>
    <button class="btn" id="themeBtn" data-act="theme" type="button" aria-label="Switch theme">🌙</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>

<div id="app">
  <aside>
    <div class="side-head">
      <div class="side-title">Stories <span class="pill" id="count"></span></div>
      <input type="search" id="q" placeholder="Search stories" aria-label="Search stories">
      <button class="btn pri" data-act="new" type="button" style="justify-content:center">+ New story</button>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="placeholder" id="empty">Select a story, or start a new one.</div>
    <div id="ed" hidden>
      <div class="ed-head">
        <button class="btn" id="back" data-act="back" type="button">← All</button>
        <button class="sb-t" id="sbT" data-act="settings" type="button" aria-expanded="false" aria-controls="sbPanel" title="Story settings"><span class="chev">▸</span><h2 id="hTitle"></h2></button>
        <span class="pill" id="hTag"></span>
        <span id="hMeta"></span>
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-mode="editor">Editor</button>
          <button type="button" data-mode="split">Split</button>
          <button type="button" data-mode="preview">Preview</button>
        </div>
      </div>
      <div id="sbPanel" hidden></div>
      <div class="body" id="body"></div>
    </div>
  </main>
</div>

<script>
var STAT=['Developing','Confirmed','Disputed','Resolved'], DBN='news-editor-v2';
var mem={}, db=null, data={stories:[]}, meta={edited:0,backed:0}, tm=null;
var sel=null, mode='split', barOpen=false, openId=null, pvSel=null, pvAll=false;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}
function today(){return new Date().toISOString().slice(0,10)}
function when(u){return fmt(u.date)+(u.time?', '+u.time:'')}

var SAMPLE=[
 {id:'s1',title:'Metro extension gets final approval',tag:'Transport',file:'news1.html',draft:false,updates:[
  {id:'u1',date:'2026-09-12',time:'',status:'Developing',headline:'Route proposal sent to the state board',text:'The planning body submitted the revised route for the eastern extension.',article:'',source:'https://example.com/metro-route'},
  {id:'u2',date:'2026-09-20',time:'',status:'Developing',headline:'Public hearing scheduled',text:'Residents can submit objections until the end of the month.',article:'',source:''},
  {id:'u3',date:'2026-09-29',time:'16:30',status:'Confirmed',headline:'Board approves the extension',text:'The board cleared the route with two changes to station locations.',article:'## What changed\n\nThe board cleared the route with **two changes** to station locations:\n\n- The Eastern Market stop moves 400 m north\n- A new interchange is added at the ring road\n\n> Work is expected to start after the budget review.\n\nImages can be linked like this: `![Route map](images/metro-route.jpg)`',source:'https://example.com/metro-approved'},
  {id:'u7',date:'2026-09-29',time:'09:15',status:'Developing',headline:'Board meets to vote on the route',text:'The vote is the last step before construction can be tendered.',article:'',source:''}]},
 {id:'s2',title:'Data rules draft opens for comments',tag:'Policy',file:'news2.html',draft:false,updates:[
  {id:'u4',date:'2026-09-05',time:'',status:'Developing',headline:'Draft published for 30-day consultation',text:'The draft covers consent, storage limits and breach reporting.',article:'',source:''},
  {id:'u5',date:'2026-09-26',time:'',status:'Disputed',headline:'Industry groups object to the consent clause',text:'Three trade bodies say the clause is unworkable for small firms.',article:'Three trade bodies wrote to the ministry this week.\n\nThey argue the consent clause would force small firms to rebuild their sign-up flows, and ask for a longer transition period.',source:'https://example.com/consent-clause'}]},
 {id:'s3',title:'New airport terminal opening date',tag:'Travel',file:'news3.html',draft:true,updates:[
  {id:'u6',date:'2026-10-01',time:'',status:'Developing',headline:'Opening date still unannounced',text:'Operators say final safety checks are under way.',article:'',source:''}]}
];

/* ---------- storage (IndexedDB, in-memory fallback) ---------- */
function openDb(){return new Promise(function(res){try{var r=indexedDB.open(DBN,1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function kvGet(k){return new Promise(function(res){if(!db)return res(mem[k]);try{var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(undefined)}}catch(e){res(mem[k])}})}
function kvSet(k,v){mem[k]=v;if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
function flush(){clearTimeout(tm);kvSet('data',JSON.parse(JSON.stringify(data)));kvSet('meta',meta)}
function save(){meta.edited=Date.now();clearTimeout(tm);tm=setTimeout(flush,350);renderBackup()}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});

/* ---------- helpers ---------- */
function get(id){return data.stories.filter(function(s){return s.id===id})[0]}
function sorted(s){return s.updates.map(function(u,i){return[u,i]}).sort(function(a,b){return (b[0].date+' '+(b[0].time||'')).localeCompare(a[0].date+' '+(a[0].time||''))||b[1]-a[1]}).map(function(x){return x[0]})}
function cur(s){return sorted(s)[0]}
function last(s){var c=cur(s);return c?c.date:''}
function stPill(st){return '<span class="st"><i class="dot '+st+'"></i>'+st+'</span>'}
function sPill(s){var c=cur(s);return c?stPill(c.status):'<span class="st">No updates yet</span>'}
function srcLink(u){return !u?'':/^https?:\/\//i.test(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Source</a>':'<span class="time">'+esc(u)+'</span>'}
function md(t){return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t||'',{breaks:true})):'<p class="plain">'+esc(t)+'</p>'}
function toast(m){var t=$('toast');if(t)t.remove();document.body.insertAdjacentHTML('beforeend','<div id="toast" role="status">'+esc(m)+'</div>');setTimeout(function(){var x=$('toast');if(x)x.remove()},2400)}

/* ---------- rendering ---------- */
function renderBackup(){
  var b=$('bk');
  if(!meta.backed){b.textContent='Not backed up yet';b.className='pill warn'}
  else if(meta.edited>meta.backed){b.textContent='Changes not backed up';b.className='pill warn'}
  else{b.textContent='Backed up '+new Date(meta.backed).toLocaleDateString('en-IN',{day:'numeric',month:'short'});b.className='pill'}
}
function renderList(){
  var q=$('q').value.trim().toLowerCase();
  var arr=data.stories.filter(function(s){return !q||(s.title+' '+s.tag).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (last(b)||'9999').localeCompare(last(a)||'9999')});
  $('count').textContent=data.stories.length;
  $('list').innerHTML=arr.length?arr.map(function(s){
    return '<button class="conv'+(s.id===sel?' active':'')+'" data-open="'+s.id+'" type="button"><div class="t">'+esc(s.title||'Untitled story')+'</div><div class="m">'+sPill(s)+(s.draft?'<span class="pill">Draft</span>':'')+'<span>'+fmt(last(s))+'</span></div></button>';
  }).join(''):'<div class="none">No stories match your search.</div>';
}
function renderHead(s){
  $('hTitle').textContent=s.title||'Untitled story';$('hTag').textContent=s.tag||'General';
  $('hMeta').innerHTML=sPill(s)+' <span class="pill'+(s.draft?'':' ok')+'">'+(s.draft?'Draft':'Published')+'</span>';
}
function renderEd(){
  var s=get(sel);
  $('empty').hidden=!!s;$('ed').hidden=!s;
  if(!s)return;
  renderHead(s);
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false')});
  $('sbT').setAttribute('aria-expanded',barOpen?'true':'false');$('sbT').querySelector('.chev').textContent=barOpen?'▾':'▸';
  var sp=$('sbPanel');sp.hidden=!barOpen;if(barOpen)sp.innerHTML=vSettings(s);
  var showEd=mode!=='preview', showPv=mode!=='editor';
  $('body').className='body'+(mode==='split'?' split':'');
  $('body').innerHTML=(showEd?'<div class="pane" id="edp">'+vTimeline(s)+'</div>':'')+(showPv?'<div class="pane" id="pv">'+vPreview(s)+'</div>':'');
}
function refreshLive(){var s=get(sel);if(!s)return;renderHead(s);renderList();if($('pv'))$('pv').innerHTML=vPreview(s)}
function vSettings(s){
  return '<div class="sb form"><div class="sb-g"><label>Title<input type="text" id="sbTitle" data-f="title" value="'+esc(s.title)+'"></label>'+
   '<label>Tag<input type="text" data-f="tag" value="'+esc(s.tag)+'"></label>'+
   '<label>Page filename<input type="text" data-f="file" value="'+esc(s.file)+'"></label>'+
   '<label class="sw"><input type="checkbox" data-f="pub"'+(s.draft?'':' checked')+'><span id="swTxt">'+(s.draft?'Draft':'Published')+'</span></label></div>'+
   '<div class="sb-f"><small>Keep the filename unchanged after the first upload so existing links keep working. Drafts stay in the editor and are left out of the public JSON.</small><button class="btn sm" data-act="delStory" type="button">Delete story</button></div></div>';
}
function vTimeline(s){
  var us=sorted(s);
  return '<div class="tbar"><span>'+us.length+(us.length===1?' update':' updates')+', newest first. Click a card to edit it, or empty space to close it.</span><button class="btn pri" data-act="addUpd" type="button">+ Add update</button></div><div class="ups">'+
   (us.length?us.map(function(u){return u.id===openId?openCard(u):closedCard(u)}).join(''):'<div class="none card">No updates yet. Add the first one to start the timeline.</div>')+'</div>';
}
function closedCard(u){
  return '<article class="card u click" data-card="'+u.id+'" tabindex="0"><div class="u-top">'+stPill(u.status)+'<span class="time">'+when(u)+'</span>'+(u.article?'<span class="pill">Has article</span>':'')+
   '<span class="acts"><button class="btn sm" data-act="editUpd" data-id="'+u.id+'" type="button">Edit</button><button class="btn sm" data-act="delUpd" data-id="'+u.id+'" type="button">Delete</button></span></div><h3>'+esc(u.headline)+'</h3>'+
   (u.text?'<p class="plain">'+esc(u.text)+'</p>':'')+(u.source?'<div style="margin-top:6px">'+srcLink(u.source)+'</div>':'')+'</article>';
}
function openCard(u){
  return '<article class="card u open"><div class="u-top"><strong>Editing update</strong><span class="acts"><button class="btn sm" data-act="delUpd" data-id="'+u.id+'" type="button">Delete</button><button class="btn sm pri" data-act="done" type="button">Done</button></span></div><div class="form">'+
   '<div class="g3"><label>Date<input type="date" data-uf="date" value="'+esc(u.date)+'"></label><label>Time (optional)<input type="time" data-uf="time" value="'+esc(u.time||'')+'"></label>'+
   '<label>Status after this update<select data-uf="status">'+STAT.map(function(x){return '<option'+(x===u.status?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label></div>'+
   '<label>Headline<input type="text" data-uf="headline" value="'+esc(u.headline)+'"></label>'+
   '<label>Short summary<small>Shown in the timeline and above the article.</small><textarea data-uf="text" style="min-height:70px">'+esc(u.text)+'</textarea></label>'+
   '<label>Source link (optional)<input type="text" data-uf="source" value="'+esc(u.source)+'" placeholder="https://"></label>'+
   '<div class="ar" id="ar"><div class="ar-h"><strong>Article</strong><span class="time">Markdown. Link images as images/name.jpg</span><button class="btn sm" data-act="bigAr" type="button">Expand</button></div>'+
   '<div class="ar-b"><textarea data-uf="article" placeholder="Write the full article here">'+esc(u.article)+'</textarea><div class="md ar-pv" id="arPv">'+md(u.article)+'</div></div></div></div></article>';
}
function vPreview(s){
  var us=sorted(s);
  if(!us.some(function(x){return x.id===pvSel}))pvSel=us[0]?us[0].id:null;
  var cu=us.filter(function(x){return x.id===pvSel})[0], list=pvAll?us:us.slice(0,3);
  return '<div class="pv-bar"><span class="time">This is how the live page will look.</span><button class="btn" type="button" disabled title="Coming in the next step">Export HTML</button></div>'+
  '<div class="pvw"><article class="pv">'+(s.draft?'<div class="banner">Draft: this story is not included in the public JSON.</div>':'')+
  '<span class="pill">'+esc(s.tag||'General')+'</span><h1>'+esc(s.title||'Untitled story')+'</h1>'+
  '<div class="pv-strip"><div><span>Status</span>'+sPill(s)+'</div><div><span>Last update</span><b>'+(last(s)?fmt(last(s)):'None')+'</b></div><div><span>First reported</span><b>'+(us.length?fmt(us[us.length-1].date):'None')+'</b></div><div><span>Updates</span><b>'+us.length+'</b></div></div>'+
  '<div class="pv-cols"><nav class="tl2" aria-label="Updates">'+(list.map(function(u){
    return '<button class="tl-i" type="button" data-pv="'+u.id+'" aria-current="'+(u.id===pvSel)+'"><i class="dot '+u.status+'"></i><span class="time">'+when(u)+'</span><b>'+esc(u.headline)+'</b>'+(u.article?'<span class="cue">Read article</span>':'')+'</button>';
  }).join('')||'<div class="none">No updates yet.</div>')+
  (us.length>3?'<button class="btn sm more" type="button" data-act="pvAll">'+(pvAll?'Show fewer':'Show all '+us.length+' updates')+'</button>':'')+'</nav>'+
  '<div class="read">'+(cu?'<div class="u-top">'+stPill(cu.status)+'<span class="time">'+when(cu)+'</span></div><h2>'+esc(cu.headline)+'</h2>'+(cu.text?'<p class="lead">'+esc(cu.text)+'</p>':'')+(cu.article?'<div class="md">'+md(cu.article)+'</div>':'')+(cu.source?'<p>'+srcLink(cu.source)+'</p>':''):'')+'</div></div></article></div>';
}

/* ---------- actions ---------- */
function openUpdate(id){openId=id;pvSel=id;renderEd();var c=document.querySelector('.card.open');if(c)c.scrollIntoView({block:'nearest'})}
function closeCard(){
  var s=get(sel);if(!s||!openId)return;
  var o=s.updates.filter(function(x){return x.id===openId})[0];if(o&&!o.headline.trim())o.headline='Untitled update';
  var keep=openId;openId=null;save();flush();renderList();renderEd();
  var c=document.querySelector('[data-card="'+keep+'"]');if(c)c.scrollIntoView({block:'nearest'});
}
function saveUi(){kvSet('ui',{mode:mode,barOpen:barOpen})}
function exportPub(){
  var pub=data.stories.filter(function(s){return !s.draft}).map(function(s){var c=cur(s);return{id:s.id,title:s.title,tag:s.tag,status:c?c.status:'',updated:last(s),updates:s.updates.length,file:s.file}}).sort(function(a,b){return b.updated.localeCompare(a.updated)});
  dl('news.json',{generated:new Date().toISOString(),stories:pub});toast(pub.length+' published stories exported');
}
function dl(name,obj){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function backup(){dl('news-backup-'+today()+'.json',{version:2,stories:data.stories});meta.backed=Date.now();meta.edited=Math.min(meta.edited,meta.backed);flush();renderBackup();toast('Backup downloaded')}
function importFile(f){
  if(!f)return;var r=new FileReader();
  r.onload=function(){
    var j;try{j=JSON.parse(r.result)}catch(e){return toast('This file is not valid JSON.')}
    if(!j||!Array.isArray(j.stories)||!j.stories.every(function(s){return s&&Array.isArray(s.updates)}))return toast('This is not a full backup. Use a file from Backup, not the public JSON.');
    if(!confirm('Replace all '+data.stories.length+' stories in this editor with '+j.stories.length+' from the file?'))return;
    data={stories:j.stories.map(function(s){s.updates=s.updates.map(function(u){u.time=u.time||'';u.article=u.article||'';u.text=u.text||'';u.source=u.source||'';return u});return s})};
    sel=null;openId=null;save();flush();renderList();renderEd();toast('Backup imported');
  };
  r.readAsText(f);
}

document.addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  if(openId&&mode!=='preview'){
    var tg=e.target,ep=$('edp');
    if((tg===$('body')||(ep&&ep.contains(tg)))&&!tg.closest('.card,button,input,select,textarea,label')){closeCard();return}
  }
  var t=e.target.closest('[data-act],[data-open],[data-mode],[data-pv],[data-card]');if(!t)return;
  var d=t.dataset, s=get(sel);
  if(d.open){sel=d.open;openId=null;pvSel=null;pvAll=false;$('app').classList.add('reading');renderList();renderEd();return}
  if(d.mode){mode=d.mode;saveUi();renderEd();return}
  if(d.pv){
    pvSel=d.pv;$('pv').innerHTML=vPreview(s);
    var rd=$('pv').querySelector('.read'),tl=$('pv').querySelector('.tl2');
    if(rd&&tl&&rd.offsetTop>tl.offsetTop+10)rd.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(!d.act){if(d.card)openUpdate(d.card);return}
  switch(d.act){
   case'new':var n=data.stories.length+1;while(data.stories.some(function(x){return x.file==='news'+n+'.html'}))n++;
     var ns={id:'s'+Date.now(),title:'Untitled story',tag:'General',file:'news'+n+'.html',draft:true,updates:[]};
     data.stories.push(ns);sel=ns.id;openId=null;barOpen=true;saveUi();save();$('app').classList.add('reading');renderList();renderEd();var ti=$('sbTitle');if(ti){ti.focus();ti.select()}break;
   case'back':$('app').classList.remove('reading');break;
   case'settings':barOpen=!barOpen;saveUi();renderEd();break;
   case'addUpd':var u={id:'u'+Date.now(),date:today(),time:'',status:'Developing',headline:'',text:'',article:'',source:''};
     s.updates.push(u);save();openUpdate(u.id);var h=document.querySelector('[data-uf="headline"]');if(h)h.focus();break;
   case'editUpd':openUpdate(d.id);break;
   case'done':closeCard();break;
   case'delUpd':if(confirm('Delete this update?')){s.updates=s.updates.filter(function(x){return x.id!==d.id});if(openId===d.id)openId=null;save();renderList();renderEd()}break;
   case'bigAr':var ar=$('ar');ar.classList.toggle('big');t.textContent=ar.classList.contains('big')?'← Back to card':'Expand';break;
   case'pvAll':pvAll=!pvAll;$('pv').innerHTML=vPreview(s);break;
   case'delStory':if(confirm('Delete "'+(s.title||'Untitled story')+'" and all its updates?')){data.stories=data.stories.filter(function(x){return x.id!==sel});sel=null;save();$('app').classList.remove('reading');renderList();renderEd()}break;
   case'import':$('file').click();break;
   case'exportPub':exportPub();break;
   case'backup':backup();break;
   case'theme':setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f,uf=t.dataset&&t.dataset.uf,s=get(sel);if(!s)return;
  if(f==='pub'){s.draft=!t.checked;var sw=$('swTxt');if(sw)sw.textContent=t.checked?'Published':'Draft'}
  else if(f){s[f]=t.type==='checkbox'?t.checked:t.value}
  else if(uf){var u=s.updates.filter(function(x){return x.id===openId})[0];if(!u)return;u[uf]=t.value;if(uf==='article'){var p=$('arPv');if(p)p.innerHTML=md(t.value)}}
  else return;
  save();refreshLive();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){var ar=$('ar');if(ar&&ar.classList.contains('big')){ar.classList.remove('big');var b=ar.querySelector('[data-act="bigAr"]');if(b)b.textContent='Expand'}else if(openId)closeCard()}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.card)openUpdate(e.target.dataset.card);
});
$('q').addEventListener('input',renderList);
$('file').addEventListener('change',function(e){importFile(e.target.files[0]);e.target.value=''});

/* ---------- theme (same key as Tools Hub) ---------- */
function setTheme(m){
  var r=document.documentElement;if(m==='dark')r.setAttribute('data-theme','dark');else r.removeAttribute('data-theme');
  $('themeBtn').textContent=m==='dark'?'☀️':'🌙';
  try{localStorage.setItem('hub-theme',m)}catch(e){}
}
var th='light';try{th=localStorage.getItem('hub-theme')||'light'}catch(e){}
setTheme(th);

/* ---------- start ---------- */
(async function(){
  db=await openDb();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  var d=await kvGet('data'), m=await kvGet('meta'), ui=await kvGet('ui');
  data=d&&Array.isArray(d.stories)?d:{stories:JSON.parse(JSON.stringify(SAMPLE))};
  if(m)meta=m;if(ui){if(['editor','split','preview'].indexOf(ui.mode)>=0)mode=ui.mode;barOpen=!!ui.barOpen}
  renderBackup();renderList();renderEd();
})();
</script>
</body>
</html>
